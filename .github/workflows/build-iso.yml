# .github/workflows/build-iso.yml
# AuroraMax GameHack ISO Build Workflow

name: Build Installer ISO

on:
  # Allow manual trigger after OCI variant image is published to GHCR
  workflow_dispatch:
    inputs:
      variant:
        description: 'Variant to build ISO for'
        required: true
        default: 'init-minimal'
        type: choice
        options:
          - init-minimal
          - init-stable
          - init-cuttingedge
          - init-ux
          - init-dev
          - init-gaming
          - init-hacking
          - semifinal
          - release-candidate
      image_tag:
        description: 'Image tag to use (leave empty for latest)'
        required: false
        default: ''
        type: string

env:
  REGISTRY: ghcr.io
  REGISTRY_USER: ${{ github.repository_owner }}
  IMAGE_NAME: auroramax-gamehack

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            buildah \
            qemu-utils \
            xorriso \
            isolinux \
            syslinux-efi \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools

      - name: Determine variant and image reference
        id: image-ref
        env:
          INPUT_VARIANT: ${{ github.event.inputs.variant }}
          INPUT_IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          VARIANT="${INPUT_VARIANT:-init-minimal}"
          if [[ ! "${VARIANT}" =~ ^[a-z0-9-]+$ ]]; then
            echo "Invalid variant: ${VARIANT}" >&2
            exit 1
          fi
          echo "variant=${VARIANT}" >> "$GITHUB_OUTPUT"

          IMAGE_TAG="${INPUT_IMAGE_TAG:-latest}"
          if [[ ! "${IMAGE_TAG}" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "Invalid image_tag: ${IMAGE_TAG}" >&2
            exit 1
          fi
          echo "ref=${REGISTRY}/${REGISTRY_USER}/${IMAGE_NAME}-${VARIANT}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Authenticate Buildah with GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s\n' "${GHCR_TOKEN}" | buildah login -u "${GHCR_USER}" --password-stdin "${REGISTRY}"

      - name: Pull OCI image
        env:
          IMAGE_REF: ${{ steps.image-ref.outputs.ref }}
        run: |
          buildah pull "${IMAGE_REF}"
          buildah images

      - name: Create ISO configuration
        env:
          IMAGE_REF: ${{ steps.image-ref.outputs.ref }}
          VARIANT: ${{ steps.image-ref.outputs.variant }}
        run: |
          cat > iso-config.toml << EOF
          [image]
          transport = "registry"
          name = "${IMAGE_REF}"

          [installer]
          vendor = "AuroraMax Project"
          product = "AuroraMax GameHack"
          variant = "${VARIANT}"

          [boot]
          title = "AuroraMax GameHack - ${VARIANT}"
          timeout = 30

          [output]
          filename = "auroramax-gamehack-${VARIANT}.iso"
          EOF

      - name: Build ISO using bootc-image-builder
        env:
          IMAGE_REF: ${{ steps.image-ref.outputs.ref }}
          VARIANT: ${{ steps.image-ref.outputs.variant }}
        run: |
          echo "Building ISO with bootc-image-builder..."
          cat iso-config.toml

          mkdir -p output
          sudo podman run --rm --privileged \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v "$(pwd)/iso-config.toml:/config.toml:ro" \
            -v "$(pwd)/output:/output" \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type anaconda-iso \
            --config /config.toml \
            "${IMAGE_REF}"

          if [ -f "output/bootiso/install.iso" ] && [ ! -f "output/auroramax-gamehack-${VARIANT}.iso" ]; then
            mv "output/bootiso/install.iso" "output/auroramax-gamehack-${VARIANT}.iso"
          fi

          if [ ! -s "output/auroramax-gamehack-${VARIANT}.iso" ]; then
            echo "Error: bootc-image-builder did not produce output/auroramax-gamehack-${VARIANT}.iso" >&2
            exit 1
          fi

      - name: Calculate checksums
        run: |
          cd output
          sha256sum *.iso > SHA256SUMS
          sha512sum *.iso > SHA512SUMS

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v7
        with:
          name: auroramax-gamehack-${{ steps.image-ref.outputs.variant }}-iso
          path: |
            output/*.iso
            output/SHA256SUMS
            output/SHA512SUMS
          retention-days: 30

      - name: Create release notes
        run: |
          cat > output/release-notes.md << EOF
          # AuroraMax GameHack ISO - ${{ steps.image-ref.outputs.variant }}

          Built from: ${{ steps.image-ref.outputs.ref }}
          Build date: $(date -u +'%Y-%m-%d %H:%M:%S UTC')

          ## Installation

          1. Download the ISO file
          2. Write it to a USB drive using dd, Rufus, or Fedora Media Writer
          3. Boot from the USB drive
          4. Follow the installation wizard

          ## Verification

          Verify the ISO integrity using the provided checksums:

          \`\`\`bash
          sha256sum -c SHA256SUMS
          sha512sum -c SHA512SUMS
          \`\`\`
          EOF

      - name: Upload release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: output/release-notes.md
