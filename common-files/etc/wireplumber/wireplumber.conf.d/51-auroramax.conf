# =============================================================================
# /etc/wireplumber/wireplumber.conf.d/51-auroramax.conf
#
# WirePlumber 0.5+ configuration for AuroraMax GameHack
# =============================================================================

monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.period-size = 256
        api.alsa.headroom = 1024
        session.suspend-timeout-seconds = 0
        priority.driver = 2000
        priority.session = 1000
      }
    }
  }
]
